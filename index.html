<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Learning Log</title>
  <meta name="description" content="A small site that teaches GitHub through ten hands-on missions." />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="wrap intro">
    <h1>Learning GitHub, one commit at a time</h1>
    <p>Ten short missions. Each one is a real GitHub skill. Finish it, then tap its circle to mark it done.</p>

    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
    <p class="progress-text" id="progress-text">0 of 10 done</p>
  </header>

  <main class="wrap">
    <ol class="branch" id="missions" aria-label="Missions"></ol>

    <section class="journal" aria-labelledby="journal-title">
      <h2 id="journal-title">My journal</h2>
      <p class="hint">Add a line to <code>entries.js</code> after each mission. Your notes show up here.</p>
      <ul id="entries" class="entries"></ul>
    </section>
  </main>

  <footer class="wrap">
    <p>Made by <strong>August </strong> while learning GitHub.</p>
  </footer>

  <script src="entries.js"></script>
  <script src="script.js"></script>
</body>
</html>
